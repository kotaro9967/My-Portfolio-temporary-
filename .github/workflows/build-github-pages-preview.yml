name: Build GitHub Pages preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-preview-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          MICROCMS_SERVICE_DOMAIN: e0zqcccmnl
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          npm run build
          node scripts/prepare-github-pages.mjs

      - name: Copy static output into Pages root
        run: |
          # These directories contain generated pages only, never source/assets.
          # Remove old output so unpublished/deleted CMS entries don't remain accessible.
          git rm -r --ignore-unmatch -- _astro blog news works about services
          cp -R dist/. .

      - name: Commit Pages output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html support.js assets _astro blog news works about services 404.html favicon.svg robots.txt sitemap-index.xml sitemap-*.xml
          if git diff --cached --quiet; then
            echo "公開ファイルに変更はありません。"
            exit 0
          fi
          git commit -m "build: update GitHub Pages preview"
          git push
