name: Verify article visuals
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/article-visuals*.mjs'
      - 'scripts/article-screenshots*.mjs'
      - 'scripts/article-research*.mjs'
      - 'scripts/article-metrics*.mjs'
      - '.github/workflows/verify-article-visuals.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: node --test scripts/article-visuals.test.mjs scripts/article-screenshots.test.mjs scripts/article-research.test.mjs scripts/article-metrics.test.mjs
        env:
          VISUAL_BROWSER_TEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: sample-article-images
          path: .article-work/**/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
