name: Generate article draft

on:
  push:
    paths:
      - 'config/article-visual-trial.txt'
  workflow_dispatch:
    inputs:
      keyword:
        description: SEO記事の対象キーワード
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: generate-article-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install screenshot browser and Japanese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "MICROCMS_API_KEY is not configured."
            exit 1
          fi

      - name: Generate and save draft
        env:
          ARTICLE_VISUALS: 'true'
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          MICROCMS_REVIEWED_IMAGE_URL: ${{ vars.MICROCMS_REVIEWED_IMAGE_URL }}
          ARTICLE_KEYWORD: ${{ inputs.keyword }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          MICROCMS_SERVICE_DOMAIN: e0zqcccmnl
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_ARTICLES_ENDPOINT: articles
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ARTICLE_KEYWORD="$(cat config/article-visual-trial.txt)"
          fi
          node scripts/generate-article.mjs "$ARTICLE_KEYWORD"

      - name: Save measurement snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-measurements
          path: .article-work/metrics/*.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
