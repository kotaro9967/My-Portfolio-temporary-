<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青紫の粒子背景 — 実験用</title>
    <meta name="robots" content="noindex, nofollow">
    <style>body { margin: 0; overflow: hidden; background: #f3f1ff; }</style>
</head>
<body>
<canvas id="fallback" aria-label="青紫に光る粒子の背景" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<p id="render-status" role="status" style="position:fixed;bottom:16px;left:16px;z-index:2;margin:0;padding:10px 14px;border-radius:12px;background:#ffffffd9;color:#44426a;font:13px sans-serif;pointer-events:none">粒子プレビュー · 軽量描画</p>
<noscript>粒子を表示するにはJavaScriptを有効にしてください。</noscript>
<script>
(() => {
  const canvas = document.getElementById('fallback');
  const ctx = canvas.getContext('2d');
  if (!ctx) { document.getElementById('render-status').textContent = 'このブラウザではCanvas描画を利用できません。'; return; }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let w, h, frame;
  const sprites = [225, 260, 280].map(hue => {
    const s = document.createElement('canvas'); s.width = s.height = 96;
    const c = s.getContext('2d');
    const glow = c.createRadialGradient(48,48,0,48,48,48);
    glow.addColorStop(0,'rgba(255,255,255,1)');
    glow.addColorStop(.10,'rgba(255,255,255,1)');
    glow.addColorStop(.18,'hsla('+hue+',100%,78%,.98)');
    glow.addColorStop(.32,'hsla('+hue+',95%,61%,.72)');
    glow.addColorStop(.62,'hsla('+hue+',95%,64%,.22)');
    glow.addColorStop(1,'hsla('+hue+',95%,64%,0)');
    c.fillStyle=glow; c.fillRect(0,0,96,96); return s;
  });
  const particles = Array.from({length: innerWidth < 700 ? 160 : 360}, (_,i) => ({
    x: Math.random(), y: Math.random(), size: 10+Math.pow(Math.random(),3)*66,
    speed: 2+Math.random()*7, phase: Math.random()*Math.PI*2, sprite: sprites[i%3]
  }));
  function resize() {
    w=innerWidth; h=innerHeight; const dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw(performance.now());
  }
  function draw(ms) {
    const t = reduced.matches ? 0 : ms/1000;
    ctx.clearRect(0,0,w,h);
    for(const p of particles) {
      const x=(p.x*w + Math.sin(t*.12+p.phase)*22+w)%w;
      const y=(p.y*h-t*p.speed%(h+100)+h+100)%(h+100)-50;
      ctx.globalAlpha=.65+.35*Math.sin(t*.7+p.phase)**2;
      ctx.drawImage(p.sprite,x-p.size/2,y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
  }
  function tick(ms) {
    if(!document.hidden) draw(ms);
    if(!reduced.matches) frame=requestAnimationFrame(tick);
  }
  reduced.addEventListener('change',()=>{cancelAnimationFrame(frame);tick(performance.now());});
  addEventListener('resize',resize);
  resize(); tick(performance.now());
})();
</script>
</body>
</html>
