<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>青紫の粒子 — 奥行きと回転の実験</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5fc;color:#454961;font:14px system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.panel{position:fixed;left:20px;bottom:20px;width:min(350px,calc(100% - 40px));padding:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #fff;border-radius:18px;box-shadow:0 8px 40px #56588612}
summary{cursor:pointer;font-weight:600}p{font-size:12px;line-height:1.7;color:#767b91}
.presets{display:flex;gap:6px;margin:14px 0}button{flex:1;border:1px solid #dfe2ef;border-radius:9px;padding:9px 4px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#eaedf9;border-color:#adb8de}
label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:12px;margin:12px 0;font-size:12px}input{width:100%;accent-color:#929fc9}
#pause{width:100%;margin-top:8px}#status{margin-bottom:0}noscript{position:relative}
</style></head>
<body>
<canvas id="particles" aria-label="奥行きを持って回転する淡い青紫の粒子"></canvas>
<details class="panel" open><summary>粒子の見え方を比較</summary>
<p>手前は大きく、奥は小さく。粒子群が立体的に回転します。</p>
<div class="presets"><button data-preset="mist" aria-pressed="true">淡い霧</button><button data-preset="pearl" aria-pressed="false">白い光</button><button data-preset="depth" aria-pressed="false">奥行き重視</button></div>
<label>色の濃さ<input id="color" type="range" min="0" max="100" value="24"></label>
<label>ぼかし<input id="soft" type="range" min="0" max="100" value="65"></label>
<label>回転速度<input id="speed" type="range" min="0" max="100" value="30"></label>
<label>近づく<input id="zoom" type="range" min="0" max="100" value="70"></label>
<button id="pause">一時停止</button><p id="status" role="status">実験用ページ · 本サイトには未適用</p>
</details>
<noscript>JavaScriptを有効にすると粒子が表示されます。</noscript>
<script>
(() => {
'use strict';
const canvas=document.getElementById('particles'), ctx=canvas.getContext('2d');
if(!ctx){document.getElementById('status').textContent='Canvas描画を利用できません。';return;}
const ids=['color','soft','speed','zoom'];
const controls=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const presets={mist:[24,65,30,70],pearl:[10,40,23,75],depth:[32,32,40,60]};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches, angle=.45, last=0, w=0,h=0, sprites=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makeSprites(){
 const strength=Number(controls.color.value)/100, soft=Number(controls.soft.value)/100;
 sprites=[220,250,270].map(hue=>{
  const s=document.createElement('canvas');s.width=s.height=96;const c=s.getContext('2d');
  const g=c.createRadialGradient(48,48,0,48,48,48);
  g.addColorStop(0,'rgba(255,255,255,.98)');
  g.addColorStop(.09,'rgba(255,255,255,.96)');
  g.addColorStop(.20,'hsla('+hue+','+(12+strength*40)+'%,82%,'+(.18+strength*.35)+')');
  g.addColorStop(.42,'hsla('+hue+','+(10+strength*38)+'%,78%,'+(.09+strength*.22)+')');
  g.addColorStop(1,'hsla('+hue+',25%,85%,0)');
  c.fillStyle=g;c.fillRect(0,0,96,96);
  // A small luminous center remains visible even with a broad soft halo.
  c.fillStyle='rgba(255,255,255,'+(.85-soft*.45)+')';
  c.beginPath();c.arc(48,48,2.8-soft*1.6,0,Math.PI*2);c.fill();
  return s;
 });
}
let seed=1937;
function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const points=Array.from({length:innerWidth<700?1400:3200},(_,i)=>{
 const az=rand()*Math.PI*2, cy=rand()*2-1, sy=Math.sqrt(1-cy*cy);
 // Several spherical layers echo the reference's dense, rotating stellar cloud.
 const r=i%4===0?145+rand()*22:Math.cbrt(rand())*210;
 return {x:r*sy*Math.cos(az),y:r*cy,z:r*sy*Math.sin(az),r:.32+Math.pow(rand(),3)*1.35,tone:i%3};
});
function project(p){
 const c=Math.cos(angle),s=Math.sin(angle), tilt=.22;
 const x=p.x*c+p.z*s, z=-p.x*s+p.z*c;
 const y=p.y*Math.cos(tilt)-z*Math.sin(tilt);
 const rz=p.y*Math.sin(tilt)+z*Math.cos(tilt);
 const camera=330-Number(controls.zoom.value)*2.4;
 const depth=camera-rz;
 if(depth<12)return null;
 const scale=Math.min(w,h)*.9/depth;
 return {x:w/2+x*scale,y:h/2+y*scale,depth,scale,r:p.r,tone:p.tone};
}
function draw(){
 ctx.clearRect(0,0,w,h);
 const soft=Number(controls.soft.value)/100;
 const visible=points.map(project).filter(p=>p&&p.x>-150&&p.x<w+150&&p.y>-150&&p.y<h+150).sort((a,b)=>b.depth-a.depth);
 for(const p of visible){
  // Perspective size, distance haze and a broad foreground halo supply depth cues.
  const near=clamp((150-p.depth)/140,0,1);
  const size=clamp(p.r*p.scale*(7+soft*8)*(1+near*.65),2,130);
  ctx.globalAlpha=clamp(1-p.depth/600,.16,.9)*clamp((p.depth-12)/28,0,1);
  ctx.drawImage(sprites[p.tone],p.x-size/2,p.y-size/2,size,size);
 }
 ctx.globalAlpha=1;
}
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function tick(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!document.hidden){if(!paused)angle+=dt*Number(controls.speed.value)*.0018;draw();}requestAnimationFrame(tick);}
function updatePause(){document.getElementById('pause').textContent=paused?'回転を再開':'一時停止';}
document.getElementById('pause').addEventListener('click',()=>{paused=!paused;updatePause();});
document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{
 presets[button.dataset.preset].forEach((v,i)=>controls[ids[i]].value=v);
 document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 makeSprites();draw();
}));
ids.forEach(id=>controls[id].addEventListener('input',()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));if(id==='color'||id==='soft')makeSprites();draw();}));
reduced.addEventListener('change',()=>{paused=reduced.matches;updatePause();});
addEventListener('resize',resize);
makeSprites();updatePause();resize();requestAnimationFrame(tick);
})();
</script></body></html>
